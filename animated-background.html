<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AC Ledger Solutions</title>
<style>
:root{--bg:#20244a;--bg2:#161a38;--white:#fff;--blue:#5a7fe6;--gray:#a5a9b6;--text:#c5c9e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,var(--bg) 0%,var(--bg2) 100%);
font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--text);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
svg.logo{width:min(46vw,380px);min-width:170px;height:auto;overflow:visible;animation:float 6s ease-in-out infinite 3.5s}
.w{fill:var(--white);opacity:0;animation:slideIn 1s .2s cubic-bezier(.2,.8,.2,1) forwards}
.b{fill:var(--blue);opacity:0;animation:riseIn 1s .6s cubic-bezier(.2,.8,.2,1) forwards}
.c1{fill:var(--gray);opacity:0;animation:fromRight 1s 1s cubic-bezier(.2,.8,.2,1) forwards}
.c2{fill:var(--gray);opacity:0;animation:fromRight 1s 1.25s cubic-bezier(.2,.8,.2,1) forwards}
.shine{fill:url(#sg);mix-blend-mode:overlay;transform:translateX(-260px);animation:sweep 1.8s 2.6s ease-in-out forwards,sweep 1.8s 10s ease-in-out infinite}
h1{margin:clamp(14px,3vw,34px) 0 0;font-weight:600;font-size:clamp(26px,6.6vw,64px);letter-spacing:.14em;color:#eceff9;white-space:nowrap}
h1{min-height:1.2em}
h1 span.ch{display:inline-block;visibility:hidden}
h1 span.cur{display:inline-block;width:0;height:.78em;border-right:.07em solid var(--blue);animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.line{height:2px;width:0;background:var(--blue);margin:14px 0 16px;animation:grow 1.2s 2.6s ease-out forwards}
p.svc{margin:0;max-width:820px;font-family:Arial,Helvetica,sans-serif;font-size:clamp(11px,1.7vw,16px);line-height:1.9;opacity:0;animation:fade 1.2s 3.2s forwards}
@keyframes slideIn{from{opacity:0;transform:translate(-40px,30px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-260px)}to{transform:translateX(700px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes grow{to{width:min(80vw,480px)}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <svg class="logo" viewBox="310 100 540 360" role="img" aria-label="AC Ledger Solutions logo">
    <defs>
      <linearGradient id="sg" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="cp">
        <polygon points="468,110 544,110 397,465 321,465"/>
        <polygon points="541,124 692,465 617,465 512,212"/>
        <path d="M588,195 Q711,66 838,185 L793,222 Q721,135 613,255 Z"/>
        <path d="M668,392 Q740,392 793,355 L838,385 Q770,452 690,447 Z"/>
      </clipPath>
    </defs>
    <polygon class="w" points="468,110 544,110 397,465 321,465"/>
    <polygon class="b" points="541,124 692,465 617,465 512,212"/>
    <path class="c1" d="M588,195 Q711,66 838,185 L793,222 Q721,135 613,255 Z"/>
    <path class="c2" d="M668,392 Q740,392 793,355 L838,385 Q770,452 690,447 Z"/>
    <g clip-path="url(#cp)"><rect class="shine" x="300" y="100" width="150" height="370"/></g>
  </svg>
  <h1 id="title" aria-label="AC Ledger Solutions"></h1>
  <div class="line"></div>
  <p class="svc">Bookkeeping &nbsp;•&nbsp; Tax Preparation &nbsp;•&nbsp; Payroll Processing &nbsp;•&nbsp; Financial Reports<br>Cleanup Projects &nbsp;•&nbsp; QuickBooks Setup &amp; Training &nbsp;•&nbsp; Inventory Count Support &nbsp;•&nbsp; Notarial Services</p>
</div>
<script>
(function(){
  var t=document.getElementById('title'),s='AC LEDGER SOLUTIONS';
  var sp=[],cur=document.createElement('span');cur.className='cur';cur.setAttribute('aria-hidden','true');
  for(var i=0;i<s.length;i++){var e=document.createElement('span');e.className='ch';e.textContent=s[i]===' '?'\u00A0':s[i];e.setAttribute('aria-hidden','true');t.appendChild(e);sp.push(e);}
  t.insertBefore(cur,sp[0]);
  var k=0,rm0=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function typeNext(){
    if(k<sp.length){sp[k].style.visibility='visible';k++;t.insertBefore(cur,sp[k]||null);setTimeout(typeNext,70+Math.random()*60);}
    else{setTimeout(function(){cur.style.visibility='hidden';cur.style.animation='none';},3000);}
  }
  if(rm0){sp.forEach(function(e){e.style.visibility='visible'});cur.style.display='none';}else{setTimeout(typeNext,1800);}
  var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,P=[],d=Math.min(devicePixelRatio||1,2);
  function rs(){W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    P=[];var n=Math.round(W*H/22000);for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.25+.08,a:Math.random()*.4+.15,b:Math.random()<.3});}
  addEventListener('resize',rs);rs();
  var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function f(){x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];if(!rm){p.y-=p.v;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=p.b?'rgba(90,127,230,'+p.a+')':'rgba(255,255,255,'+p.a*.6+')';x.fill();}
    requestAnimationFrame(f);}
  f();
})();
</script>
</body>
</html>
